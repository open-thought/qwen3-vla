# FSDP Test Configuration for Qwen3-VLA Training
# Minimal config for testing multi-GPU FSDP training

# Model configuration
model_name: Qwen/Qwen3-VL-2B-Instruct
original_vocab_size: 151936
new_vocab_size: 153984

# FSDP configuration
use_fsdp: true
fsdp_sharding_strategy: NO_SHARD  # Start with no sharding to test basic DDP functionality
fsdp_cpu_offload: false
fsdp_backward_prefetch: BACKWARD_PRE
fsdp_state_dict_type: FULL_STATE_DICT
fsdp_activation_checkpointing: false
fsdp_sync_module_states: true  # Sync model weights from rank 0 to all ranks
fsdp_use_orig_params: true
fsdp_limit_all_gathers: true

# Dataset configuration
dataset_root: /mnt/robotwin/dataset
norm_stats_path: data/robotwin_norm_stats_test.json
valid_timesteps_path: data/test_valid_timesteps.json
action_horizon: 8
pad_action_horizon: false
image_size:
- 320
- 240

# Data filtering - TEST: single robot and task
robot_types:
- franka
variants:
- clean_50
tasks:
- adjust_bottle

# Image augmentation
enable_augmentation: true
max_num_transforms: 3
random_order: false
val_use_augmentation: false

# Training split
validation_split: 0.1

# Training hyperparameters - minimal for testing
batch_size: 1  # Per-GPU batch size (effective = 1 * 2 GPUs * 2 accum = 4)
gradient_accumulation_steps: 1
learning_rate: 1.0e-05
vision_lr: 2.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
max_steps: 20  # Very short run for testing
warmup_steps: 5

# LoRA configuration
use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- v_proj
- k_proj
- o_proj

# Checkpointing and evaluation
checkpoint_dir: checkpoints/qwen3-vla-fsdp-test
save_interval: 10
val_interval: 10
max_val_batches: 5

# DataLoader configuration
num_workers: 2
prefetch_factor: 2

# WandB logging - disabled for quick test
enable_wandb: false
wandb_project: qwen3-vla-robotwin
wandb_entity: null
wandb_run_name: fsdp-test-2gpu
wandb_log_interval: 5

# Mixed precision training
use_amp: true

# Seed for reproducibility
seed: 42

# Resume training
resume_from_checkpoint: null
