# Training Configuration for Qwen3-VLA
# Full RoboTwin dataset - aloha-agilex robot, stack_blocks_two task, action_horizon=8
# Using BSplineTokenizer with 255 bins and symmetric delta normalization
# BSpline provides smooth trajectory encoding with 50% fewer tokens than Bin
# Base model: Qwen3-VL-4B-Instruct

# Model configuration
model_name: Qwen/Qwen3-VL-4B-Instruct
original_vocab_size: 151936
new_vocab_size: 152256  # 151936 + 257 = 152193, rounded up to next 64
tokenizer_type: bspline  # "bspline" or "bin"
n_bins: 255  # Use 255 bins for exact zero reconstruction with symmetric bounds
symmetric_delta_norm: true  # Use symmetric normalization (0 maps to exactly 0)

# B-spline tokenizer configuration
bspline_n_control_points: 8  # Number of control points per DoF
bspline_degree: 4  # B-spline polynomial degree
bspline_bounds: [-1.5, 1.5]  # Bounds for control point values
bspline_token_order: basis_first  # Token ordering: "basis_first" or "joint_first"

use_fsdp: true
fsdp_sharding_strategy: NO_SHARD  # Use DDP - fastest for systems without P2P/NVLink
fsdp_activation_checkpointing: true

# Gripper binarization (converts continuous gripper values to binary 0/1)
# Uses forward-looking relabeling for intermediate values
binarize_grippers: true
gripper_open_threshold: 0.95  # Values > this are considered open (1.0)
gripper_closed_threshold: 0.3  # Values < this are considered closed (0.0)

# Dataset configuration
dataset_root: /mnt/robotwin/dataset
norm_stats_path: data/robotwin_norm_stats_h8.json
episode_lengths_path: data/robotwin_episode_lengths_stack_blocks_two.json
valid_timesteps_path: data/robotwin_valid_timesteps_stack_blocks_two.json
action_horizon: 8
pad_action_horizon: false  # Use variable-length sequences for better data quality
image_size:
- 320
- 240

# Data filtering - Use aloha-agilex robot type, variants, and tasks (null = no filtering)
robot_types:
- aloha-agilex
variants:
- clean_1k
#- perturbed_1k
tasks:
- stack_blocks_two

# Image augmentation
enable_augmentation: true
max_num_transforms: 3
random_order: false
val_use_augmentation: false

# State dropout (to prevent shortcut learning via state)
# Forces model to rely on images by masking state values with "?"
#state_dropout_prob: 0.5  # 50% chance each state value is replaced with "?"
#state_dropout_full_prob: 0.25  # 25% chance ALL state values are masked

# Text state in prompt
# When false, robot state is not included as text in the prompt
# (useful when relying solely on neural state encoder)
include_text_state_in_prompt: false

# Image dropout (to foster learning from neural state encoder)
# image_dropout_all_prob: Probability of omitting ALL images from the prompt
# image_dropout_prob: Probability of omitting each individual image independently
image_dropout_all_prob: 0.5  # Probability to drop all images (0.0 = disabled)
image_dropout_prob: 0.1  # Probability to drop each individual image (0.0 = disabled)

# State reconstruction auxiliary task
# When state is dropped, model must reconstruct full state from images
state_reconstruction: true
state_reconstruction_only_on_dropout: false  # Only add reconstruction when state was dropped

# State history encoder configuration
# Encodes K timesteps of robot state history through a neural network
# and prepends the resulting embeddings to the transformer input sequence
use_state_encoder: true
state_encoder_type: conv1d  # "conv1d", "mlp", "transformer", "rnn"
state_history_len: 24  # Number of past timesteps (K) to encode
state_encoder_hidden_dim: 256  # Hidden dimension for encoder
state_encoder_n_output_tokens: 24  # Number of output embedding tokens
state_encoder_dropout: 0.0  # Dropout for regularization
# Conv1D encoder specific
state_encoder_conv_channels:
- 64
- 128
- 256
state_encoder_conv_kernel_size: 3

# Training split
validation_split: 0.05

# Training hyperparameters
batch_size: 3
gradient_accumulation_steps: 4  # With 8-bit optimizer and no_sync, we have memory for accumulation
learning_rate: 3.0e-05
weight_decay: 0.01
max_grad_norm: 1.0
max_steps: 100000
warmup_steps: 1000
use_8bit_optimizer: true  # 8-bit Adam: 4x less optimizer memory (32GB -> 8GB)

# LoRA configuration
use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- v_proj
- k_proj
- o_proj

# Checkpointing and evaluation
checkpoint_dir: /mnt/robotwin/checkpoints/qwen3-h8-stack_two-bspline-conv-drop2
save_interval: 10000
val_interval: 5000
max_val_batches: 100

# DataLoader configuration
num_workers: 4
prefetch_factor: 2

# WandB logging
enable_wandb: true
wandb_project: qwen3-vla-robotwin
wandb_entity: null
wandb_run_name: qwen3-h8-stack_two-bspline-convstate
wandb_log_interval: 50

# Mixed precision training (always uses bfloat16)
use_amp: true

# Seed for reproducibility
seed: 42

# Resume training
resume_from_checkpoint: null
