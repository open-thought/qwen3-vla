# Training Configuration for Qwen3-VLA
# Full RoboTwin dataset - all robots, all variants, action_horizon=8
# Using BinTokenizer with 257 bins and symmetric delta normalization
# This ensures exact zero reconstruction for idle frames

# Model configuration
model_name: Qwen/Qwen3-VL-2B-Instruct
original_vocab_size: 151936
new_vocab_size: 152193  # 151936 + 257 (BinTokenizer with 257 bins)
tokenizer_type: bin
n_bins: 257  # Use 257 bins for exact zero reconstruction
symmetric_delta_norm: true  # Use symmetric normalization (0 maps to exactly 0)

# Gripper binarization (converts continuous gripper values to binary 0/1)
# Uses forward-looking relabeling for intermediate values
binarize_grippers: false  # Set to true to enable gripper binarization
gripper_open_threshold: 0.95  # Values > this are considered open (1.0)
gripper_closed_threshold: 0.05  # Values < this are considered closed (0.0)

# Dataset configuration
dataset_root: /mnt/robotwin/dataset
norm_stats_path: data/robotwin_norm_stats_h8.json
valid_timesteps_path: data/robotwin_valid_timesteps_h8.json
action_horizon: 8
pad_action_horizon: false  # Use variable-length sequences for better data quality
image_size:
- 320
- 240

# Data filtering - Use aloha-agilex robot type, variants, and tasks (null = no filtering)
robot_types:
- aloha-agilex
variants: null
tasks: null

# Image augmentation
enable_augmentation: true
max_num_transforms: 3
random_order: false
val_use_augmentation: false

# State dropout (to prevent shortcut learning via state)
# Forces model to rely on images by masking state values with "?"
state_dropout_prob: 0.5  # 50% chance each state value is replaced with "?"
state_dropout_full_prob: 0.25  # 25% chance ALL state values are masked

# State reconstruction auxiliary task
# When state is dropped, model must reconstruct full state from images
state_reconstruction: true
state_reconstruction_only_on_dropout: true  # Only add reconstruction when state was dropped

# Training split
validation_split: 0.05

# Training hyperparameters
batch_size: 7  # Can use larger batch with shorter action horizon
gradient_accumulation_steps: 4
learning_rate: 2.0e-05
weight_decay: 0.01
max_grad_norm: 1.0
max_steps: 100000
warmup_steps: 1000

# LoRA configuration
use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- v_proj
- k_proj
- o_proj

# Checkpointing and evaluation
checkpoint_dir: /mnt/robotwin/checkpoints/qwen3-vla-robotwin-full-h8-bin-sym
save_interval: 10000
val_interval: 5000
max_val_batches: 100

# DataLoader configuration
num_workers: 8
prefetch_factor: 2

# WandB logging
enable_wandb: true
wandb_project: qwen3-vla-robotwin
wandb_entity: null
wandb_run_name: aloha-h8-bin-sym-state-dropout
wandb_log_interval: 50

# Mixed precision training (always uses bfloat16)
use_amp: true

# Seed for reproducibility
seed: 42

# Resume training
resume_from_checkpoint: null
