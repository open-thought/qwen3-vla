# Training Configuration for Qwen3-VLA
# Full training on Franka robot with clean_50 variant

# Model configuration
model_name: Qwen/Qwen3-VL-2B-Instruct
original_vocab_size: 151936
new_vocab_size: 153984

# Dataset configuration
dataset_root: /mnt/robotwin/dataset
norm_stats_path: data/robotwin_norm_stats_franka_clean50.json
episode_lengths_path: data/robotwin_episode_lengths_franka_clean50.json
action_horizon: 50
image_size:
- 320
- 240

# Data filtering - Training on Franka robot with clean_50 variant
robot_types:
- franka
variants:
- clean_50
tasks:
- adjust_bottle
- beat_block_hammer
- blocks_ranking_rgb
- blocks_ranking_size
- click_alarmclock
- click_bell
- dump_bin_bigbin
- grab_roller
- handover_block
- handover_mic
- hanging_mug
- lift_pot
- move_can_pot
- move_pillbottle_pad
- move_playingcard_away
- move_stapler_pad
- open_laptop
- open_microwave
- pick_diverse_bottles
- pick_dual_bottles
- place_a2b_left
- place_a2b_right
- place_bread_basket
- place_bread_skillet
- place_burger_fries
- place_can_basket
- place_cans_plasticbox
- place_container_plate
- place_dual_shoes
- place_empty_cup
- place_fan
- place_mouse_pad
- place_object_basket
- place_object_scale
- place_object_stand
- place_phone_stand
- place_shoe
- press_stapler
- put_bottles_dustbin
- put_object_cabinet
- rotate_qrcode
- scan_object
- shake_bottle
- shake_bottle_horizontally
- stack_blocks_three
- stack_blocks_two
- stack_bowls_three
- stack_bowls_two
- stamp_seal
- turn_switch

# Image augmentation
enable_augmentation: true
max_num_transforms: 3
random_order: false
val_use_augmentation: false

# Training split
validation_split: 0.1

# Training hyperparameters
batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 2.0e-05
weight_decay: 0.01
max_grad_norm: 1.0
max_steps: 500000
warmup_steps: 5000

# LoRA configuration
use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- v_proj
- k_proj
- o_proj

# Checkpointing and evaluation
checkpoint_dir: checkpoints/qwen3-vla-robotwin-franka-clean50
save_interval: 10000
val_interval: 5000
max_val_batches: 100

# DataLoader configuration
num_workers: 8
prefetch_factor: 2

# WandB logging
enable_wandb: true
wandb_project: qwen3-vla-robotwin
wandb_entity: null
wandb_run_name: franka-clean50-full
wandb_log_interval: 50

# Mixed precision training (always uses bfloat16)
use_amp: true

# Seed for reproducibility
seed: 42

# Resume training
resume_from_checkpoint: null
