# Test Configuration for Qwen3-VLA Training
# Reduced scope: single robot type and task for quick testing

# Model configuration
model_name: Qwen/Qwen3-VL-2B-Instruct
original_vocab_size: 151936
new_vocab_size: 153984

# Dataset configuration
dataset_root: /mnt/robotwin/dataset
norm_stats_path: data/robotwin_norm_stats_test.json
episode_lengths_path: data/robotwin_episode_lengths_test.json
action_horizon: 50
image_size:
- 320
- 240

# Data filtering - TEST: single robot and task
robot_types:
- franka
variants:
- clean_50
tasks:
- adjust_bottle

# Image augmentation
enable_augmentation: true
max_num_transforms: 3
random_order: false
val_use_augmentation: false

# Training split
validation_split: 0.1

# Training hyperparameters - TEST: reduced for faster iteration
batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 2.0e-05
weight_decay: 0.01
max_grad_norm: 1.0
max_steps: 50000
warmup_steps: 100

# LoRA configuration
use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- v_proj
- k_proj
- o_proj

# Checkpointing and evaluation - TEST: more frequent for monitoring
checkpoint_dir: checkpoints/qwen3-vla-robotwin-test
save_interval: 5000
val_interval: 1000
max_val_batches: 100

# DataLoader configuration
num_workers: 4
prefetch_factor: 2

# WandB logging
enable_wandb: true
wandb_project: qwen3-vla-robotwin
wandb_entity: null
wandb_run_name: test-franka-adjust_bottle
wandb_log_interval: 10

# Mixed precision training (always uses bfloat16)
use_amp: true

# Seed for reproducibility
seed: 42

# Resume training
resume_from_checkpoint: null
